<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steveo Platformer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #fff;
      user-select: none;
    }
    h1 {
      flex-shrink: 0;
      font-size: 1.1rem;
      padding: 5px 0 3px;
      color: #7ec8e3;
      text-shadow: 1px 1px 0 #004466, 2px 2px 0 #002233;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #canvas-wrap {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #canvas-inner {
      position: relative;
      border: 3px solid #444;
      box-shadow: 0 0 40px rgba(0,100,200,0.3);
      line-height: 0;
    }
    canvas {
      display: block;
      cursor: crosshair;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #controls {
      flex-shrink: 0;
      padding: 2px 0 4px;
      font-size: 0.6rem;
      color: #444;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    #controls kbd {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 2px;
      padding: 0 3px;
      color: #555;
      font-family: inherit;
      font-size: inherit;
    }
    #start-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 1000;
    }
    #start-screen h2 {
      font-size: 1.6rem;
      color: #7ec8e3;
      letter-spacing: 4px;
      text-shadow: 1px 1px 0 #004466, 2px 2px 0 #002233;
      text-transform: uppercase;
    }
    #start-button {
      padding: 18px 64px;
      font-size: 1.3rem;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #7ec8e3;
      border: 2px solid #7ec8e3;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      text-transform: uppercase;
    }
    #start-button:hover {
      background: #7ec8e3;
      color: #000;
    }
    #start-button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div id="start-screen">
    <h2>⛏ Steveo Platformer</h2>
    <button id="start-button">Start Game</button>
  </div>
  <h1>⛏ Steveo Platformer</h1>
  <div id="canvas-wrap">
    <div id="canvas-inner">
      <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>
  </div>
  <div id="controls">
    <kbd>WASD</kbd> Move &nbsp;·&nbsp;
    <kbd>Space</kbd> Attack/Bow &nbsp;·&nbsp;
    <kbd>Click</kbd> Mine/Place &nbsp;·&nbsp;
    <kbd>I</kbd> Inventory &nbsp;·&nbsp;
    <kbd>E</kbd> Chest &nbsp;·&nbsp;
    <kbd>U</kbd> Portal &nbsp;·&nbsp;
    <kbd>H</kbd> Help &nbsp;·&nbsp;
    <kbd>Esc</kbd> Menu &nbsp;·&nbsp;
    2P: <kbd>IJKL</kbd>+<kbd>U</kbd>
  </div>

  <script src="js/constants.js?v=17d6"></script>
  <script src="js/blocks.js?v=17d6"></script>
  <script src="js/controller-config.js?v=17d6"></script>
  <script src="js/controller-input.js?v=17d6"></script>
  <script src="js/input.js?v=17d6"></script>
  <script src="js/camera.js?v=17d6"></script>
  <script src="js/mobs.js?v=17d6"></script>
  <script src="js/crafting.js?v=17d6"></script>
  <script src="js/player.js?v=17d6"></script>
  <script src="js/level.js?v=17d6"></script>
  <script src="js/redstone.js?v=17d6"></script>
  <script src="js/world.js?v=17d6"></script>
  <script src="js/sandbox.js?v=17d6"></script>
  <script src="js/save-migrations.js?v=17d6"></script>
  <script src="js/saves.js?v=17d6"></script>
  <script src="js/speedrunner-mode.js?v=17d6"></script>
  <script src="js/game.js?v=17d6"></script>
  <script src="js/menu.js?v=17d6"></script>
  <!-- Phase 16: Multiplayer (socket.io loaded from CDN; falls back gracefully if unavailable) -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="js/multiplayer.js"></script>
  <!-- Phase 16-A: Online lobby UI -->
  <script src="js/online-ui.js"></script>

  <script>
    // ── Responsive canvas scaling ────────────────────────────────
    // Scales the canvas CSS display size to fill the available space
    // while maintaining the internal 800×500 resolution and aspect ratio.
    // Game logic and input.js coordinate correction handle the rest.
    (function () {
      const GAME_W = 800, GAME_H = 500;

      function resizeCanvas() {
        const wrap   = document.getElementById('canvas-wrap');
        const canvas = document.getElementById('gameCanvas');
        if (!wrap || !canvas) return;
        // Account for border (3px each side = 6px total per axis)
        const availW = wrap.clientWidth  - 6;
        const availH = wrap.clientHeight - 6;
        const scale  = Math.min(availW / GAME_W, availH / GAME_H);
        canvas.style.width  = Math.round(GAME_W * scale) + 'px';
        canvas.style.height = Math.round(GAME_H * scale) + 'px';
      }

      window.addEventListener('resize', resizeCanvas);
      // Run after DOM + initial layout is complete
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', resizeCanvas);
      } else {
        resizeCanvas();
      }
      // Second pass after fonts/images settle
      setTimeout(resizeCanvas, 200);
    })();

    // ── Start button: gate audio unlock behind a user gesture ───
    (function () {
      const screen = document.getElementById('start-screen');
      const btn    = document.getElementById('start-button');
      if (!screen || !btn) return;
      btn.addEventListener('click', () => {
        screen.style.display = 'none';
        // Audio is now unlocked for this page context.
        // The menu's _initMenuAudio() will start the intro loop.
        if (window._menuRef && typeof window._menuRef._initMenuAudio === 'function') {
          window._menuRef._initMenuAudio();
        }
      });
    })();
  </script>
</body>
</html>
