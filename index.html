<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steveo Platformer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
      user-select: none;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #7ec8e3;
      text-shadow: 2px 2px 0 #004466, 4px 4px 0 #002233;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #canvas-wrap {
      position: relative;
      border: 3px solid #444;
      box-shadow: 0 0 40px rgba(0,100,200,0.3);
    }
    canvas {
      display: block;
      cursor: crosshair;
      image-rendering: pixelated;
    }
    #controls {
      margin-top: 10px;
      display: flex;
      gap: 24px;
      font-size: 0.72rem;
      color: #555;
    }
    #controls span { color: #888; }
    #controls kbd {
      background: #222;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 1px 5px;
      color: #aaa;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <h1>⛏ Steveo Platformer</h1>
  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>
  <div id="controls">
    <span><kbd>A</kbd><kbd>D</kbd> Move &nbsp;|&nbsp; <kbd>W</kbd> Jump &nbsp;|&nbsp; <kbd>S</kbd> Crouch</span>
    <span><kbd>Space</kbd> Attack &nbsp;|&nbsp; <kbd>Hold Click</kbd> Mine &nbsp;|&nbsp; <kbd>Click Air</kbd> Place</span>
    <span><kbd>1–9</kbd> / Scroll Hotbar &nbsp;|&nbsp; <kbd>P</kbd> Swap Weapon</span>
    <span><kbd>E</kbd> Crafting &nbsp;|&nbsp; <kbd>I</kbd> Inventory &nbsp;|&nbsp; <kbd>L</kbd> Lever</span>
    <span><kbd>F</kbd> Save at Bed &nbsp;|&nbsp; <kbd>U</kbd> Portal &nbsp;|&nbsp; <kbd>Esc</kbd> Menu</span>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/input.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/mobs.js"></script>
  <script src="js/crafting.js"></script>
  <script src="js/player.js"></script>
  <script src="js/level.js"></script>
  <script src="js/redstone.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sandbox.js"></script>
  <script src="js/saves.js"></script>
  <script src="js/game.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
